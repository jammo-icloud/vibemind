<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vibemind — Website UI Kit</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--ink); color: var(--paper); font-family: var(--font-body); }
    #app { min-height: 100vh; }

    @keyframes vmLaserSweep { 0% { background-position: 200% 0; } 100% { background-position: -100% 0; } }

    /* Buttons (shared) */
    .vm-btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-body); font-weight: 800; font-size: 13px;
      letter-spacing: 0.2em; text-transform: uppercase;
      padding: 14px 26px; border-radius: 999px; border: 0; cursor: pointer;
      transition: all .22s var(--ease-out);
      white-space: nowrap;
    }
    .vm-btn-primary { background: var(--ink); color: var(--paper); }
    .vm-btn-primary:hover { background: var(--marquee); color: var(--ink); }
    .vm-btn-marquee { background: var(--marquee); color: var(--ink); }
    .vm-btn-marquee:hover { background: var(--paper); color: var(--ink); }
    .vm-btn-ghost-light { background: transparent; color: var(--paper); border: 2px solid var(--paper); }
    .vm-btn-ghost-light:hover { background: var(--paper); color: var(--ink); }
    .vm-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    const { Header, Footer, Hero, MusicSection, BandSection, GigsSection, TipJarSection } = window.VM;

    function App() {
      const [page, setPage] = useState('home');

      const renderPage = () => {
        switch (page) {
          case 'music': return <MusicSection />;
          case 'band':  return <BandSection />;
          case 'gigs':  return <GigsSection />;
          case 'tipjar':return <TipJarSection />;
          case 'contact': return (
            <section style={{ background:'var(--ink)', color:'var(--paper)', padding:'120px 32px', textAlign:'center' }}>
              <div className="vm-eyebrow" style={{ color:'var(--marquee)' }}>Contact</div>
              <h2 style={{ fontFamily:'var(--font-display)', textTransform:'uppercase', fontSize:72, margin:'12px 0 16px', lineHeight:1 }}>Say hi</h2>
              <p style={{ fontSize:18, maxWidth:560, margin:'0 auto 28px' }}>Booking? A request? Just want to say the show was rad? We'd love to hear from you.</p>
              <button className="vm-btn vm-btn-marquee">vibemindband@gmail.com</button>
            </section>
          );
          default: return (
            <>
              <Hero />
              <BandSection />
              <GigsSection />
              <MusicSection />
              <TipJarSection />
            </>
          );
        }
      };

      return (
        <div data-screen-label={`vibemind-${page}`}>
          <Header active={page} onNav={setPage} />
          {renderPage()}
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Vibetrip</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:var(--font-body);}
  .wrap{padding:24px;height:340px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1.4fr;gap:24px;align-items:center;}
  .meta .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--marquee);margin-bottom:8px;}
  .meta h2{font-family:var(--font-display);text-transform:uppercase;font-size:54px;line-height:.95;letter-spacing:.01em;margin:0 0 10px;}
  .meta p{margin:0 0 14px;color:var(--fg-on-ink-2);font-size:14px;line-height:1.55;max-width:420px;}
  .members{display:flex;gap:10px;}
  .m{flex:1;background:var(--ink-2);border-radius:14px;overflow:hidden;border:1px solid var(--hairline-on-ink);}
  .m .img{aspect-ratio:1;background-size:cover;background-position:center top;filter:grayscale(100%) contrast(1.05);}
  .m .bar{height:3px;}
  .m .body{padding:10px 12px;}
  .m .role{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-on-ink-3);margin-bottom:3px;}
  .m .nm{font-family:var(--font-display);font-size:16px;text-transform:uppercase;line-height:1;}
</style></head><body>
<div class="wrap">
  <div class="meta">
    <div class="eyebrow">The Spinoff Trio</div>
    <h2>Vibetrip</h2>
    <p>Three of the six. Smaller rooms, tighter setlist, same alien. <b style="color:var(--paper)">Heather, Boomer &amp; Jim.</b></p>
    <p style="font-size:12px;color:var(--fg-on-ink-3);">Tag gigs with the <b>VIBETRIP</b> badge so locals know which lineup to expect.</p>
  </div>
  <div class="members">
    <div class="m"><div class="img" style="background-image:url('../assets/heather.jpg')"></div><div class="bar" style="background:#E63B95"></div><div class="body"><div class="role">Vocals · gtr</div><div class="nm">Heather</div></div></div>
    <div class="m"><div class="img" style="background-image:url('../assets/boomer.jpg')"></div><div class="bar" style="background:#36B249"></div><div class="body"><div class="role">Gtr · harp · vox</div><div class="nm">Boomer</div></div></div>
    <div class="m"><div class="img" style="background-image:url('../assets/jim.jpg')"></div><div class="bar" style="background:#F5C518"></div><div class="body"><div class="role">Guitar</div><div class="nm">Jim "Rigs"</div></div></div>
  </div>
</div>
</body></html>

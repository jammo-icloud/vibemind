<!doctype html>
<html><head><meta charset="utf-8"><title>Gig Posters</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--paper-2);color:var(--ink);font-family:var(--font-body);}
  .wrap{padding:24px;height:380px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brick);}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1;}
  .poster{background:var(--ink);border:2px solid var(--ink);box-shadow:5px 5px 0 0 var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .poster img{width:100%;height:100%;object-fit:cover;}
  .desc{font-size:12px;color:var(--fg-on-paper-2);max-width:780px;line-height:1.5;}
</style></head><body>
<div class="wrap">
  <div class="eyebrow">Promo Posters · Real Examples</div>
  <div class="desc">Posters are <b>square-cornered</b>, dark, and graphic. They feature the wordmark + Vibey, venue, and date in chunky type. The band makes new ones for each show — rotate them on the gigs page.</div>
  <div class="row">
    <div class="poster"><img src="../assets/poster-remlinger-aug.png" alt=""></div>
    <div class="poster"><img src="../assets/poster-prohibition.png" alt=""></div>
    <div class="poster"><img src="../assets/poster-earthday-vibetrip.png" alt=""></div>
  </div>
</div>
</body></html>

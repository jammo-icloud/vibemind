<!doctype html>
<html><head><meta charset="utf-8"><title>Member Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink);font-family:var(--font-body);color:var(--paper);}
  .wrap{padding:24px;height:340px;box-sizing:border-box;display:flex;gap:18px;align-items:stretch;}
  .card{flex:1;background:var(--ink-2);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--hairline-on-ink);}
  .card .img{aspect-ratio:1;background-size:cover;background-position:center top;filter:grayscale(100%) contrast(1.05);}
  .card .body{padding:14px;}
  .card .role{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-on-ink-3);margin-bottom:6px;}
  .card .nm{font-family:var(--font-display);font-size:18px;text-transform:uppercase;line-height:1;margin:0 0 4px;}
  .card .nick{font-size:11px;color:var(--fg-on-ink-2);font-style:italic;}
  .card .bar{height:3px;background:var(--rainbow);}
</style></head><body>
<div class="wrap">
  <div class="card">
    <div class="img" style="background-image:url('../assets/heather.jpg')"></div>
    <div class="bar"></div>
    <div class="body">
      <div class="role">Lead vocals · acoustic gtr</div>
      <h3 class="nm">Heather<br>Morris</h3>
      <div class="nick">"Heathercita"</div>
    </div>
  </div>
  <div class="card">
    <div class="img" style="background-image:url('../assets/nic.jpg')"></div>
    <div class="bar"></div>
    <div class="body">
      <div class="role">Bass · vocals</div>
      <h3 class="nm">Nic<br>Fillingham</h3>
      <div class="nick">"Nic-o-time"</div>
    </div>
  </div>
  <div class="card">
    <div class="img" style="background-image:url('../assets/dane.jpg')"></div>
    <div class="bar"></div>
    <div class="body">
      <div class="role">Drums</div>
      <h3 class="nm">Dane<br>Estepa</h3>
      <div class="nick">"Ese"</div>
    </div>
  </div>
</div>
</body></html>

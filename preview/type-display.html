<!doctype html>
<html><head><meta charset="utf-8"><title>Display Type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:var(--font-body);}
  .wrap{padding:24px;height:280px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-on-ink-3);}
  .specimen{font-family:var(--font-display);text-transform:uppercase;line-height:.92;letter-spacing:.01em;}
  .meta{font-size:12px;color:var(--fg-on-ink-2);font-family:ui-monospace,monospace;}
  .bar{height:4px;background:var(--rainbow);border-radius:999px;}
</style></head><body>
<div class="wrap">
  <div class="eyebrow">Display — Bowlby One SC <span style="opacity:.5;">(substitute)</span></div>
  <div class="specimen" style="font-size:96px;">VIBEMIND</div>
  <div class="bar"></div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;">
    <div class="specimen" style="font-size:38px;">THE&nbsp;BAND</div>
    <div class="specimen" style="font-size:24px;">THE&nbsp;GIGS</div>
    <div class="meta">--font-display · 0.01em</div>
  </div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Logo Variants — Vibemind vs Vibetrip</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:var(--font-body);}
  .wrap{padding:24px;height:340px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--marquee);}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;}
  .col{background:var(--ink-2);border:1px solid var(--hairline-on-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;}
  .col img{max-height:170px;width:auto;object-fit:contain;filter:invert(1);}
  .badge{position:absolute;top:10px;left:10px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;background:var(--marquee);color:var(--ink);padding:4px 9px;border-radius:999px;}
  .meta{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-on-ink-3);}
  .desc{font-size:13px;color:var(--fg-on-ink-2);text-align:center;max-width:240px;line-height:1.4;}
</style></head><body>
<div class="wrap">
  <div class="eyebrow">Logo Variants — Use the right one</div>
  <div class="row">
    <div class="col">
      <div class="badge">6 Heads</div>
      <img src="../assets/logo-vibemind-full.png" alt="Vibemind">
      <div class="meta">Vibemind · The Six</div>
      <div class="desc">Six alien heads in tribal wreath. Use whenever the full band plays.</div>
    </div>
    <div class="col">
      <div class="badge">3 Heads</div>
      <img src="../assets/logo-vibetrip-full.png" alt="Vibetrip">
      <div class="meta">Vibetrip · The Trio</div>
      <div class="desc">Three heads in a triangular swirl. Heather, Boomer &amp; Jim.</div>
    </div>
  </div>
</div>
</body></html>

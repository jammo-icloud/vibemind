<!doctype html>
<html><head><meta charset="utf-8"><title>Marquee Accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;font-family:var(--font-body);background:var(--paper);}
  .wrap{padding:24px;height:260px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-on-paper-3);}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .chip{aspect-ratio:1.4;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-weight:700;font-size:11px;}
  .light{color:#0E0E12;}
  .dark{color:#FAF6EE;}
  .name{letter-spacing:.1em;text-transform:uppercase;}
  .hex{font-family:ui-monospace,monospace;opacity:.85;font-weight:500;font-size:11px;}
  .marqdemo{background:#F5B921 url('../assets/og-poster.jpg') center/cover;height:60px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:32px;color:#B83A1F;text-transform:uppercase;letter-spacing:.04em;}
</style></head><body>
<div class="wrap">
  <div>
    <div class="eyebrow" style="margin-bottom:12px;">Marquee — Live-Music Sign</div>
    <div class="row">
      <div class="chip light" style="background:#F5B921"><span class="name">Marquee</span><span class="hex">#F5B921</span></div>
      <div class="chip light" style="background:#D9A018"><span class="name">Marquee Deep</span><span class="hex">#D9A018</span></div>
      <div class="chip dark" style="background:#B83A1F"><span class="name">Brick</span><span class="hex">#B83A1F</span></div>
      <div class="chip dark" style="background:#8B2914"><span class="name">Brick Deep</span><span class="hex">#8B2914</span></div>
    </div>
  </div>
  <div class="marqdemo">LIVE&nbsp;MUSIC</div>
</div>
</body></html>

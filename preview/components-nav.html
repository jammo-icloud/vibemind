<!doctype html>
<html><head><meta charset="utf-8"><title>Nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;font-family:var(--font-body);background:var(--ink);color:var(--paper);}
  .wrap{height:240px;display:flex;flex-direction:column;}
  .top{background:rgba(14,14,18,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--hairline-on-ink);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{width:36px;height:36px;}
  .brand .nm{font-family:var(--font-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;}
  .nav{display:flex;gap:22px;}
  .nav a{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--paper);text-decoration:none;opacity:.85;transition:color .2s;}
  .nav a:hover{color:var(--marquee);opacity:1;}
  .nav a.active{color:var(--marquee);}
  .cta{background:var(--marquee);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;}
  .hero{flex:1;background:url('../assets/band3.jpg') center/cover;position:relative;}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,14,18,.0),rgba(14,14,18,.85));}
  .hero .tag{position:absolute;left:24px;bottom:18px;z-index:2;font-family:var(--font-display);text-transform:uppercase;font-size:42px;line-height:.95;}
  .hero .bar{position:absolute;left:24px;right:24px;bottom:14px;height:3px;background:var(--rainbow);border-radius:999px;z-index:2;display:none;}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="../assets/alien-bud.jpg" alt=""><span class="nm">Vibemind</span></div>
    <div class="nav"><a class="active">Home</a><a>The Vibes</a><a>The Band</a><a>The Gigs</a><a>Tip Jar</a><a>Contact</a></div>
    <div class="cta">Join the List</div>
  </div>
  <div class="hero"><div class="tag">Live in the<br>Snoqualmie Valley</div></div>
</div>
</body></html>

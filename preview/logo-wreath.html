<!doctype html>
<html><head><meta charset="utf-8"><title>Logo Wreath</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  .wrap{display:grid;grid-template-columns:1fr 220px;gap:24px;align-items:center;padding:24px;height:260px;box-sizing:border-box;}
  .logo{width:220px;height:220px;display:flex;align-items:center;justify-content:center;}
  .logo img{width:100%;height:100%;object-fit:contain;}
  .meta .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-on-paper-3);margin-bottom:10px;}
  .meta h2{font-family:var(--font-display);text-transform:uppercase;font-size:42px;line-height:.95;letter-spacing:.01em;margin:0 0 12px;}
  .meta p{margin:0;color:var(--fg-on-paper-2);font-size:14px;line-height:1.5;}
  .members{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;}
  .members span{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:5px 9px;border-radius:999px;}
</style></head><body>
<div class="wrap">
  <div class="meta">
    <div class="eyebrow">Band Mark</div>
    <h2>Six-Vibey<br>Wreath</h2>
    <p>The band-of-six version of the mascot — six Vibey heads ringed in tribal flourish. Used as the website avatar and on Vibemind merch.</p>
    <div class="members">
      <span>Heather</span><span>Nic</span><span>Jim</span><span>Boomer</span><span>Dane</span><span>Sally</span>
    </div>
  </div>
  <div class="logo"><img src="../assets/logo-vibey-art.png" alt="Vibemind 6-head wreath"></div>
</div>
</body></html>

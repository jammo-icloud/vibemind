<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink);color:var(--fg-on-ink-1);font-family:var(--font-body);}
  .wrap{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;padding:24px;height:260px;box-sizing:border-box;}
  .logo{width:200px;height:200px;display:flex;align-items:center;justify-content:center;}
  .logo img{width:100%;height:100%;object-fit:contain;}
  .meta .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-on-ink-3);margin-bottom:10px;}
  .meta h2{font-family:var(--font-display);text-transform:uppercase;font-size:42px;line-height:.95;letter-spacing:.01em;margin:0 0 12px;}
  .meta p{margin:0;color:var(--fg-on-ink-2);font-size:14px;line-height:1.5;}
  .bar{height:6px;background:var(--rainbow);border-radius:999px;margin-top:16px;}
</style></head><body>
<div class="wrap">
  <div class="logo"><img src="../assets/alien-bud.jpg" alt="Vibey"></div>
  <div class="meta">
    <div class="eyebrow">The Mascot</div>
    <h2>Vibey</h2>
    <p>Custom alien logo. Black silhouette, rainbow chakra of dots flowing from forehead to chin. The whole brand radiates from this character.</p>
    <div class="bar"></div>
  </div>
</div>
</body></html>

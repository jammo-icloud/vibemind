<!doctype html>
<html><head><meta charset="utf-8"><title>Body Type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  .wrap{padding:24px;height:280px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-on-paper-3);}
  .row{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:baseline;border-bottom:1px solid var(--hairline-on-paper);padding-bottom:10px;}
  .row:last-child{border-bottom:0;padding-bottom:0;}
  .label{font-family:ui-monospace,monospace;font-size:11px;color:var(--fg-on-paper-3);}
  .h3{font-family:var(--font-body);font-weight:800;font-size:24px;line-height:1.15;}
  .body{font-family:var(--font-body);font-weight:400;font-size:16px;line-height:1.55;}
  .small{font-family:var(--font-body);font-weight:500;font-size:13px;line-height:1.4;color:var(--fg-on-paper-2);}
  .eb{font-family:var(--font-body);font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;}
</style></head><body>
<div class="wrap">
  <div class="eyebrow">Body — Inter</div>
  <div class="row"><div class="label">eyebrow / 13<br>weight 700</div><div class="eb">Upbeat and Uplifting</div></div>
  <div class="row"><div class="label">h3 / 24<br>weight 800</div><div class="h3">Covers from 1960s to NOW</div></div>
  <div class="row"><div class="label">body / 16<br>weight 400</div><div class="body">An all-Snoqualmie Valley party band, bringing locals together through music we love.</div></div>
  <div class="row"><div class="label">small / 13<br>weight 500</div><div class="small">© 2021 by Vibemind &nbsp;·&nbsp; Snoqualmie, WA</div></div>
</div>
</body></html>
